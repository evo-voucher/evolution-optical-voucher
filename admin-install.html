<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08122f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Admin">
  <title>Admin</title>
  <link rel="manifest" href="manifest-admin.json">
  <link rel="apple-touch-icon" sizes="180x180" href="admin-icon-180.png">
  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(circle at 50% 18%,#1a2a6c 0,#08122f 42%,#030815 100%);color:#fff}
    main{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box}
    .card{width:min(420px,100%);text-align:center;padding:30px;border:1px solid rgba(255,255,255,.14);
      border-radius:26px;background:rgba(255,255,255,.055);box-shadow:0 22px 70px rgba(0,0,0,.35)}
    img{width:118px;height:118px;border-radius:25px;box-shadow:0 15px 36px rgba(0,0,0,.35)}
    h1{margin:18px 0 8px;font-size:29px}
    p{margin:0;color:#cbd5e1;line-height:1.6}
    .btn{display:block;margin-top:22px;padding:14px 18px;border-radius:14px;
      background:linear-gradient(135deg,#7657ff,#1aa7ff);color:#fff;text-decoration:none;font-weight:800}
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).catch(() => {});
      });
    }
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
      location.replace('admin-launch.html');
    }
  </script>
</head>
<body>
  <main>
    <div class="card">
      <img src="admin-icon-180.png" alt="Admin">
      <h1>Admin</h1>
      <p>Add this portal to your Home Screen for an app-like experience.</p>
      <a class="btn" href="admin-launch.html">Open Admin</a>
    </div>
  </main>
</body>
</html>
