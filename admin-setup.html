<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Evolution Voucher Admin Setup</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07152f;--card:#0d1c3d;--line:#334d87;--text:#fff;--muted:#b8c5e2;--ok:#6fe3b2;--err:#ff9bad}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.card{width:min(460px,100%);background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);border-radius:22px;padding:24px;box-shadow:0 20px 60px #0006}h1{margin:0 0 6px;font:500 28px Georgia,serif;letter-spacing:1px}p{margin:0 0 16px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.tabs button.active{border-color:#6fe3b2;background:#176158}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px;color:#d9e3ff}input,button{width:100%;min-height:44px;border-radius:12px;border:1px solid #3d5692;background:#101f45;color:#fff;padding:11px 12px}button{cursor:pointer;font-weight:800;background:linear-gradient(180deg,#3549a8,#182b73);margin-top:14px}.msg{margin-top:12px;padding:11px 13px;border-radius:12px;background:#111f42;border:1px solid #334d87}.ok{color:var(--ok)}.err{color:var(--err)}.small{font-size:12px;color:#91a2c4}
</style>
</head>
<body>
<div class="card">
  <h1>EVOLUTION OPTICAL</h1>
  <p>Voucher Admin Initial Setup</p>
  <div id="stateText" class="msg">Checking system state…</div>
  <div id="tabs" class="tabs hidden"><button id="signUpTab">Sign Up</button><button id="signInTab">Sign In</button></div>

  <section id="signUp" class="hidden">
    <label>Admin Email</label><input id="suEmail" type="email" autocomplete="username">
    <label>Admin Password</label><input id="suPassword" type="password" autocomplete="new-password">
    <label>One-Time Setup Code</label><input id="setupCode" type="password" autocomplete="off">
    <button id="signUpBtn">Create First Admin</button>
  </section>

  <section id="signIn" class="hidden">
    <label>Email</label><input id="siEmail" type="email" autocomplete="username">
    <label>Password</label><input id="siPassword" type="password" autocomplete="current-password">
    <button id="signInBtn">Sign In</button>
  </section>

  <div id="msg"></div>
  <p class="small" style="margin-top:16px">Temporary setup page. It will be removed after the first Admin is verified.</p>
</div>
<script>
(()=>{
const SUPABASE_URL='https://xfivcfwexcxsyiylgryn.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_uu1Qyx-M3dldpZn9jq7jXw_RLTHOMh_';
const db=supabase.createClient(SUPABASE_URL,PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMsg(text,ok=false){$('msg').innerHTML=text?`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`:''}
function show(which){$('signUp').classList.add('hidden');$('signIn').classList.add('hidden');$(which).classList.remove('hidden');$('signUpTab').classList.toggle('active',which==='signUp');$('signInTab').classList.toggle('active',which==='signIn')}
async function refreshState(){
  const {data,error}=await db.rpc('admin_bootstrap_status');
  if(error){$('stateText').textContent='Unable to read setup status.';setMsg(error.message);return}
  $('tabs').classList.remove('hidden');
  if(data?.bootstrap_available){$('stateText').textContent='No Admin exists yet. Create the first Admin account.';$('signUpTab').classList.remove('hidden');show('signUp')}
  else{$('stateText').textContent='Admin is initialized. Sign in below.';$('signUpTab').classList.add('hidden');show('signIn')}
}
$('signUpTab').onclick=()=>show('signUp');$('signInTab').onclick=()=>show('signIn');
$('signUpBtn').onclick=async()=>{
  const email=$('suEmail').value.trim().toLowerCase(),password=$('suPassword').value,setup_code=$('setupCode').value;
  setMsg(''); if(!email||!password||!setup_code){setMsg('Email, password and Setup Code are required.');return} if(password.length<8){setMsg('Password must be at least 8 characters.');return}
  $('signUpBtn').disabled=true;
  try{
    const {data,error}=await db.functions.invoke('bootstrap-admin',{body:{email,password,setup_code}});
    if(error)throw error; if(!data?.success)throw new Error(data?.error||'Sign Up failed.');
    const {data:login,error:loginErr}=await db.auth.signInWithPassword({email,password}); if(loginErr)throw loginErr;
    const {data:realm,error:realmErr}=await db.rpc('current_operational_realm'); if(realmErr)throw realmErr;
    if(realm?.realm!=='admin')throw new Error('Admin realm verification failed.');
    $('stateText').textContent='Admin initialized and signed in.'; $('tabs').classList.add('hidden'); $('signUp').classList.add('hidden'); $('signIn').classList.add('hidden');
    setMsg('Admin identity verified: '+(login.user?.email||email),true);
  }catch(e){setMsg(e.message||String(e))}finally{$('signUpBtn').disabled=false}
};
$('signInBtn').onclick=async()=>{
  const email=$('siEmail').value.trim().toLowerCase(),password=$('siPassword').value; setMsg(''); if(!email||!password){setMsg('Email and password are required.');return}
  $('signInBtn').disabled=true;
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password}); if(error)throw error;
    const {data:realm,error:realmErr}=await db.rpc('current_operational_realm'); if(realmErr)throw realmErr;
    if(realm?.realm!=='admin')throw new Error('This account is not an active Voucher Admin.');
    setMsg('Admin identity verified: '+(data.user?.email||email),true);
  }catch(e){setMsg(e.message||String(e))}finally{$('signInBtn').disabled=false}
};
refreshState();
})();
</script>
</body>
</html>
