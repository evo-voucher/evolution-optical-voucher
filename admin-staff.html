<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Evolution Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/backend-config.js"></script><style>:root{--ink:#f7f8ff;--muted:#aebbd8;--line:rgba(104,145,225,.34);--ok:#65e6b5;--err:#ff92a5}*{box-sizing:border-box}html,body{background:#000}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(900px,100%);margin:auto}.card{padding:20px;border-radius:22px;background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:14px}h1{margin:0 0 6px;font-size:28px}h2{margin:0 0 12px;font-size:19px}p{color:var(--muted);line-height:1.5}.field{margin-top:10px}label{display:block;margin-bottom:5px;font-size:12px;font-weight:800;color:#d9e3ff}input,select{width:100%;min-height:44px;padding:9px 11px;border:1px solid rgba(100,128,210,.55);border-radius:12px;background:#0d1839;color:#fff}button,.btn{min-height:42px;border:1px solid rgba(122,119,255,.7);border-radius:11px;background:linear-gradient(180deg,#3549a8,#182b73 58%,#0d1c4c);color:#fff;font-weight:800;cursor:pointer;padding:9px 12px;text-decoration:none}button:disabled{opacity:.55}.wide{width:100%;margin-top:13px}.msg,.status{margin-top:10px;padding:10px 12px;border-radius:12px;background:#101b44;border:1px solid var(--line);font-weight:700}.ok{color:var(--ok)}.err{color:var(--err)}.small{font-size:12px;color:#91a2c4}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:8px;flex-wrap:wrap}.staffrow{padding:14px;border:1px solid var(--line);border-radius:15px;margin-top:10px;background:rgba(5,15,43,.65)}.staffhead{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--line)}.rowgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;margin-top:10px}.rowactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.danger{border-color:#a94d65;background:#5a1d31}@media(max-width:650px){.grid,.rowgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="shell"><section class="card"><div class="top"><div><h1>Evolution Management</h1><p>Manage Evolution Optical Staff accounts and branch access.</p></div><div class="actions"><a class="btn" href="admin.html">Admin Portal</a><a class="btn" href="index.html">Return to Main</a></div></div><section id="closedState"><div class="status">Backend not configured.</div></section><section id="loginState" class="hidden"><div class="grid"><div class="field"><label>Admin Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><button id="loginBtn" class="wide">Sign In</button><div id="loginMsg"></div></section><section id="adminState" class="hidden"><div class="msg ok">Admin identity verified.</div><div id="sessionMeta" class="small"></div></section></section><section id="provisionState" class="card hidden"><h2>Create Evolution Staff</h2><div class="grid"><div class="field"><label>Staff Name</label><input id="staffName"></div><div class="field"><label>Login Email</label><input id="staffEmail" type="email"></div><div class="field"><label>Temporary Password</label><input id="staffPassword" type="password"></div><div class="field"><label>Branch</label><select id="staffBranch"></select></div><div class="field"><label>Role</label><select id="staffRole"><option value="staff">Staff</option><option value="manager">Branch Manager</option></select></div></div><button id="createBtn" class="wide">Create Evolution Staff</button><div id="createMsg"></div></section><section id="directoryState" class="card hidden"><div class="top"><div><h2>Evolution Staff Directory</h2><div class="small">Edit staff name, branch, role and account status here.</div></div><button id="refreshBtn">Refresh</button></div><div id="directory"></div><div id="directoryMsg"></div></section></main><script>(()=>{const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},$=id=>document.getElementById(id);if(!cfg.enabled)return;$('closedState').classList.add('hidden');$('loginState').classList.remove('hidden');const db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey);let branches=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(n,t,ok=false)=>n.innerHTML=t?`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`:'';async function rpc(n,a={}){const{data,error}=await db.rpc(n,a);if(error)throw error;return data}async function loadBranches(){branches=await rpc('admin_active_branches')||[];$('staffBranch').innerHTML='<option value="">Select active branch</option>'+branches.map(b=>`<option value="${b.branch_id||b.id}">${esc(b.branch_name)} (${esc(b.branch_code)})</option>`).join('')}function branchOptions(selected){return branches.map(b=>`<option value="${b.branch_id||b.id}" ${(b.branch_id||b.id)===selected?'selected':''}>${esc(b.branch_name)} (${esc(b.branch_code)})</option>`).join('')}async function loadDirectory(){const rows=await rpc('admin_staff_directory');$('directory').innerHTML=rows.length?rows.map(r=>`<div class="staffrow" data-id="${r.staff_id}"><div class="staffhead"><strong>${esc(r.staff_name)}</strong><span class="badge">${esc(r.staff_status)}</span></div><div class="small">${esc(r.login_email||'Email not recorded')} · ${esc(r.branch_name||'All branches')}</div><div class="rowgrid"><input class="n" value="${esc(r.staff_name)}"><select class="b"><option value="">All branches</option>${branchOptions(r.branch_id)}</select><select class="r"><option value="staff" ${r.staff_role==='staff'?'selected':''}>Staff</option><option value="manager" ${r.staff_role==='manager'?'selected':''}>Branch Manager</option><option value="all_branch_manager" ${r.staff_role==='all_branch_manager'?'selected':''}>All Branch Manager</option></select><select class="s"><option value="active" ${r.staff_status==='active'?'selected':''}>Active</option><option value="suspended" ${r.staff_status==='suspended'?'selected':''}>Suspended</option></select></div><div class="rowactions"><button class="save">Save Changes</button><button class="reset">Reset Password</button></div></div>`).join(''):'<div class="status">No Evolution Staff accounts yet.</div>'}async function verifyAdmin(session){if(!session?.user)return;const realm=await rpc('current_operational_realm');if(realm?.realm!=='admin')throw new Error('Active Admin access required.');$('loginState').classList.add('hidden');$('adminState').classList.remove('hidden');$('provisionState').classList.remove('hidden');$('directoryState').classList.remove('hidden');$('sessionMeta').textContent=`Signed in as ${session.user.email||session.user.id}`;await loadBranches();await loadDirectory()}$('loginBtn').onclick=async()=>{try{const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await verifyAdmin(data.session)}catch(e){msg($('loginMsg'),e.message)}};$('createBtn').onclick=async()=>{const body={staff_name:$('staffName').value.trim(),email:$('staffEmail').value.trim().toLowerCase(),password:$('staffPassword').value,branch_id:$('staffBranch').value,role:$('staffRole').value};try{const{data,error}=await db.functions.invoke('create-staff',{body});if(error)throw error;if(!data?.success)throw new Error(data?.details||data?.error);msg($('createMsg'),'Evolution Staff created successfully.',true);$('staffName').value=$('staffEmail').value=$('staffPassword').value='';await loadDirectory()}catch(e){msg($('createMsg'),e.message)}};$('refreshBtn').onclick=loadDirectory;$('directory').onclick=async e=>{const row=e.target.closest('.staffrow');if(!row)return;const id=row.dataset.id;try{if(e.target.classList.contains('save')){const role=row.querySelector('.r').value,branch=row.querySelector('.b').value;if(role!=='all_branch_manager'&&!branch)throw new Error('Select a branch for this role.');await rpc('admin_update_staff_profile',{p_staff_id:id,p_staff_name:row.querySelector('.n').value.trim(),p_branch_id:branch||null,p_role:role,p_status:row.querySelector('.s').value});msg($('directoryMsg'),'Staff updated successfully.',true);await loadDirectory()}if(e.target.classList.contains('reset')){const pw=prompt('Enter a new password (minimum 6 characters):');if(pw===null)return;if(pw.length<6)throw new Error('Password must be at least 6 characters.');const{data,error}=await db.functions.invoke('manage-evolution-staff',{body:{action:'reset_password',staff_id:id,new_password:pw}});if(error)throw error;if(!data?.success)throw new Error(data?.details||data?.error);msg($('directoryMsg'),data.message||'Password reset successfully.',true)}}catch(x){msg($('directoryMsg'),x.message)}};db.auth.getSession().then(({data})=>data?.session&&verifyAdmin(data.session).catch(e=>msg($('loginMsg'),e.message)))})();</script></body></html>
