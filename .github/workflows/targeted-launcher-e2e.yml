name: Targeted Launcher E2E

on:
  push:
    paths:
      - 'index.html'
      - 'admin-launch.html'
      - 'partner-launch.html'
      - 'staff-launch.html'
      - 'supabase/tests/browser/003_main_launcher_e2e.mjs'
      - '.github/workflows/targeted-launcher-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install browser test driver
        run: npm install --no-save puppeteer-core@24

      - name: Run targeted launcher E2E
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node supabase/tests/browser/003_main_launcher_e2e.mjs
