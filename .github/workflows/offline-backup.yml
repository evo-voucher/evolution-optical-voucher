name: Offline Backup Package

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-backup.yml'
      - 'recovery/**'
      - 'docs/**'
      - 'supabase/**'
      - '*.html'
      - 'assets/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build offline backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evolution-backup
          rsync -a --exclude='.git' --exclude='node_modules' ./ /tmp/evolution-backup/
          cat > /tmp/evolution-backup/OFFLINE-BACKUP-INFO.txt <<'EOF'
          Evolution Voucher + XiaoE Architecture Offline Backup
          Backup type: clean system initialization / source package
          Architecture: Scheme A
          Evolution: Business/Application Architecture
          XiaoE AI Core: Cognitive/Memory/Behavior Core
          Voucher Supabase project ref: hukihbcyyqhanaqrizvm
          Intended display name: Evolution Voucher Project
          XiaoE AI Core project ref: uuqiwyqxllqsuboogbxh
          Live business data included: NO
          Secrets included: NO
          Hosted cutover verified: NO
          EOF
          (cd /tmp && zip -qr Evolution-Voucher-XiaoE-Offline-Backup.zip evolution-backup)

      - name: Upload offline backup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Evolution-Voucher-XiaoE-Offline-Backup
          path: /tmp/Evolution-Voucher-XiaoE-Offline-Backup.zip
          if-no-files-found: error
