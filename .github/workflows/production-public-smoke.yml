name: Production Public Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'partner.html'
      - 'staff.html'
      - 'partner-launch.html'
      - 'staff-launch.html'
      - 'assets/js/backend-config.js'
      - '.github/workflows/production-public-smoke.yml'

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed GitHub Pages public surface
        shell: bash
        run: |
          set -euo pipefail

          base='https://evo-voucher.github.io/evolution-optical-voucher'

          for path in '/' '/admin.html' '/partner.html' '/staff.html' '/partner-launch.html' '/staff-launch.html' '/assets/js/backend-config.js'; do
            code="$(curl --silent --show-error --location --output /tmp/page --write-out '%{http_code}' "${base}${path}?smoke=$(date +%s)")"
            if [[ "$code" != '200' ]]; then
              echo "Public page failed: ${path} -> HTTP ${code}" >&2
              exit 1
            fi
            if [[ ! -s /tmp/page ]]; then
              echo "Public page empty: ${path}" >&2
              exit 1
            fi
            echo "OK ${path} (${code})"
          done

          curl --silent --show-error --location "${base}/partner.html?smoke=$(date +%s)" -o /tmp/partner.html
          curl --silent --show-error --location "${base}/staff.html?smoke=$(date +%s)" -o /tmp/staff.html

          if grep -Eiq 'Return[[:space:]]+to[[:space:]]+Main' /tmp/partner.html; then
            echo 'Partner portal exposes Return to Main' >&2
            exit 1
          fi
          if grep -Eiq 'Return[[:space:]]+to[[:space:]]+Main' /tmp/staff.html; then
            echo 'Staff portal exposes Return to Main' >&2
            exit 1
          fi

          curl --silent --show-error --location "${base}/assets/js/backend-config.js?smoke=$(date +%s)" -o /tmp/backend-config.js

          grep -Eq "enabled:[[:space:]]*true" /tmp/backend-config.js || { echo 'Deployed config is not enabled' >&2; exit 1; }
          grep -Eq "environment:[[:space:]]*'production'" /tmp/backend-config.js || { echo 'Deployed config is not production' >&2; exit 1; }
          grep -Fq "projectId: 'xfivcfwexcxsyiylgryn'" /tmp/backend-config.js || { echo 'Deployed projectId mismatch' >&2; exit 1; }
          grep -Fq "supabaseUrl: 'https://xfivcfwexcxsyiylgryn.supabase.co'" /tmp/backend-config.js || { echo 'Deployed Supabase URL mismatch' >&2; exit 1; }
          grep -Eq "publishableKey:[[:space:]]*'sb_publishable_[^']+'" /tmp/backend-config.js || { echo 'Deployed publishable key missing or wrong type' >&2; exit 1; }
          grep -Fq "siteBase: 'https://evo-voucher.github.io/evolution-optical-voucher/'" /tmp/backend-config.js || { echo 'Deployed siteBase mismatch' >&2; exit 1; }

          # Detect actual privileged credential material, not harmless comments that mention service_role.
          if grep -Eiq "sb_secret_|(service[_-]?role|serviceRole(Key)?|SUPABASE_SERVICE_ROLE_KEY)[[:space:]]*[:=][[:space:]]*['\"][^'\"]+" /tmp/backend-config.js; then
            echo 'Privileged credential material found in deployed public config' >&2
            exit 1
          fi

          echo 'Production public Pages smoke OK'
