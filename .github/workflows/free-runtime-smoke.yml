name: Free Supabase Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '*.html'
      - 'assets/js/**'
      - 'recovery/**'
      - 'docs/SYSTEM-INITIALIZATION-BACKUP.md'
      - 'docs/VOUCHER-ENGINE-READINESS.md'
      - 'docs/HOSTED-CUTOVER-RUNBOOK.md'
      - '.github/workflows/free-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate recovery manifest contract
        run: bash supabase/tests/runtime/002_recovery_manifest_contract.sh

      - name: Validate hosted cutover preflight contract
        run: bash supabase/tests/runtime/003_hosted_cutover_preflight_contract.sh

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild local database from migrations
        run: supabase db reset

      - name: Run non-destructive SQL contracts
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          for file in $(find supabase/tests -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "=== Running ${file} ==="
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run concurrent version publish runtime E2E
        run: bash supabase/tests/runtime/001_publish_concurrency_e2e.sh

      - name: Run signed GoTrue HTTP core flow E2E
        run: bash supabase/tests/http/001_signed_gotrue_core_flow_e2e.sh

      - name: Serve local Edge Functions
        run: |
          set -euo pipefail
          supabase functions serve > /tmp/evolution-edge-functions.log 2>&1 &
          echo $! > /tmp/evolution-edge-functions.pid
          for i in $(seq 1 30); do
            code="$(curl -s -o /tmp/edge-ready.json -w '%{http_code}' \
              -X POST http://127.0.0.1:54321/functions/v1/create-partner \
              -H 'Content-Type: application/json' -d '{}' || true)"
            if [[ "$code" == "401" ]]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/evolution-edge-functions.log >&2 || true
          echo 'Local Edge Functions did not become ready' >&2
          exit 1

      - name: Run Edge Function trusted-boundary E2E
        run: bash supabase/tests/http/002_edge_function_boundary_e2e.sh

      - name: Run Partner Staff Edge lifecycle E2E
        run: bash supabase/tests/http/003_partner_staff_edge_lifecycle_e2e.sh

      - name: Run Admin Edge controls E2E
        run: bash supabase/tests/http/004_admin_edge_controls_e2e.sh

      - name: Install browser test driver
        run: npm install --no-save puppeteer-core@24

      - name: Run browser E2E suites
        run: |
          set -euo pipefail
          for file in $(find supabase/tests/browser -maxdepth 1 -type f -name '*.mjs' | sort); do
            echo "=== Running ${file} ==="
            node "$file"
          done

      - name: Show local migration state
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "select version,name from supabase_migrations.schema_migrations order by version;"

      - name: Show Edge Function logs on failure
        if: failure()
        run: cat /tmp/evolution-edge-functions.log || true

      - name: Stop local Supabase
        if: always()
        run: |
          if [[ -f /tmp/evolution-edge-functions.pid ]]; then
            kill "$(cat /tmp/evolution-edge-functions.pid)" 2>/dev/null || true
          fi
          supabase stop --no-backup
