name: One-time Staff Manager Parity Inject

on:
  push:
    branches: [agent/new-supabase-cutover]
    paths:
      - '.github/workflows/one-time-staff-manager-parity-inject.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/new-supabase-cutover
          fetch-depth: 0
      - name: Inject isolated manager module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('staff.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="assets/js/staff-manager-parity.js"></script>'
          if tag in text:
              print('manager module already linked')
          else:
              marker='</body>'
              if marker not in text:
                  raise SystemExit('staff.html missing </body> marker')
              text=text.replace(marker,tag+'\n'+marker,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-staff-manager-parity-inject.yml
      - name: Verify exact scope
        run: |
          git diff --check
          git diff -- staff.html
      - name: Commit
        run: |
          git config user.name 'XiaoE Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add staff.html .github/workflows/one-time-staff-manager-parity-inject.yml
          git commit -m 'feat: load Staff manager parity module'
          git push origin agent/new-supabase-cutover
