name: Lean CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-guards:
    name: Regression Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lean regression guards
        shell: bash
        run: bash scripts/lean-ci-selfcheck.sh
