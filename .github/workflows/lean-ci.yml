name: Lean CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression-guards:
    name: Regression Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard critical application entry points
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "index.html"
            "admin-dashboard.html"
            "admin-core.html"
            "admin-staff.html"
            "experience/admin-v2.html"
            "experience/partner-v2.html"
          )

          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty critical file: $file"; exit 1; }
          done

      - name: Guard core voucher contracts
        shell: bash
        run: |
          set -euo pipefail
          migrations="supabase/migrations"
          test -d "$migrations" || { echo "Missing migrations directory"; exit 1; }

          required_contracts=(
            "issue_engine_voucher"
            "admin_engine_revoke_unissued"
            "admin_dashboard_summary"
            "purge_unredeemed_vouchers"
            "_cleanup_stale_voucher_data"
          )

          for contract in "${required_contracts[@]}"; do
            grep -Rqs --include='*.sql' "$contract" "$migrations" || {
              echo "Missing core database contract: $contract"
              exit 1
            }
          done

      - name: Guard unified cleanup source of truth
        shell: bash
        run: |
          set -euo pipefail
          grep -Rqs --include='*.sql' "_cleanup_stale_voucher_data" supabase/migrations
          grep -Rqs --include='*.sql' "purge_unredeemed_vouchers" supabase/migrations

          latest_cleanup=$(grep -Ril --include='*.sql' "create or replace function public._cleanup_stale_voucher_data" supabase/migrations | sort | tail -n 1)
          test -n "$latest_cleanup" || { echo "Unified cleanup engine definition not found"; exit 1; }

          grep -q "public._cleanup_stale_voucher_data" "$latest_cleanup" || {
            echo "Cleanup wrapper is no longer tied to the unified engine"
            exit 1
          }

      - name: Guard redeemed-history protection
        shell: bash
        run: |
          set -euo pipefail
          cleanup_file=$(grep -Ril --include='*.sql' "create or replace function public._cleanup_stale_voucher_data" supabase/migrations | sort | tail -n 1)
          grep -q "not exists(select 1 from public.redemptions" "$cleanup_file" || {
            echo "Cleanup no longer visibly protects redemption history"
            exit 1
          }

      - name: Guard browser code from service-role secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.html' --include='*.js' \
            '(SUPABASE_SERVICE_ROLE_KEY|service_role[[:space:]]*[:=][[:space:]]*["'"''][A-Za-z0-9._-]{20,})' \
            . --exclude-dir=.git; then
            echo "Potential service-role secret found in browser-delivered code"
            exit 1
          fi

      - name: Basic HTML sanity
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html admin-dashboard.html admin-core.html admin-staff.html experience/admin-v2.html experience/partner-v2.html; do
            grep -qi '<html' "$file" || { echo "$file: missing <html>"; exit 1; }
            grep -qi '</html>' "$file" || { echo "$file: missing </html>"; exit 1; }
          done

      - name: Lean CI passed
        run: echo "Critical Evolution Voucher regression guards passed."
