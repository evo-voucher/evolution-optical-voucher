name: One-time Admin Superuser Portal Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-superuser-portal-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch guarded realm checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patches = {
            'staff.html': (
              r"if\(!data\|\|data\.authenticated!==true\|\|data\.realm!=='staff'\)\{await db\.auth\.signOut\(\);throw new Error\('This account is not an active Evolution Staff account\.'\);?\}",
              "if(!data||data.authenticated!==true||!['staff','admin'].includes(data.realm)){await db.auth.signOut();throw new Error('This account is not an active Evolution Staff or Admin account.');}"
            ),
            'partner.html': (
              r"if\(!data\|\|data\.authenticated!==true\|\|data\.realm!=='partner'\)\{await db\.auth\.signOut\(\);throw new Error\('This account is not an active Partner account\.'\);?\}",
              "if(!data||data.authenticated!==true||!['partner','admin'].includes(data.realm)){await db.auth.signOut();throw new Error('This account is not an active Partner or Admin account.');}"
            )
          }

          for filename, (pattern, replacement) in patches.items():
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            updated, count = re.subn(pattern, replacement, text, count=1)
            if count != 1:
              raise SystemExit(f'{filename}: guarded realm patch expected 1 match, found {count}')
            p.write_text(updated, encoding='utf-8')
            print(f'patched {filename}')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-admin-superuser-portal-patch.yml
      - name: Commit exact patch
        run: |
          git config user.name 'XiaoE Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add staff.html partner.html .github/workflows/one-time-admin-superuser-portal-patch.yml
          git diff --cached --check
          git commit -m 'feat: allow admin superuser portal access'
          git push
