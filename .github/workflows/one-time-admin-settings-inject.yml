name: One-time Admin Settings Inject
on:
  push:
    branches: [agent/new-supabase-cutover]
    paths:
      - '.github/workflows/one-time-admin-settings-inject.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/new-supabase-cutover
          fetch-depth: 0
      - name: Inject Admin Settings module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          t=p.read_text()
          marker='</body>'
          script='<script src="assets/js/admin-settings.js"></script>\n'
          if script not in t:
            if marker not in t: raise SystemExit('body marker missing')
            t=t.replace(marker,script+marker,1)
            p.write_text(t)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/one-time-admin-settings-inject.yml
          git config user.name 'XiaoE Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html .github/workflows/one-time-admin-settings-inject.yml
          git diff --cached --check
          git commit -m 'feat: load Admin Settings utilities'
          git push origin HEAD:agent/new-supabase-cutover
