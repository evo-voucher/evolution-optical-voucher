<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<title>Partner Management</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060a18}iframe{display:block;width:100%;height:100dvh;border:0;background:#060a18}
</style>
</head>
<body>
<iframe id="partnerFrame" src="partner-v2.html?v=20260909-manualpass1" title="Partner Management"></iframe>
<script>
(()=>{
  const frame=document.getElementById('partnerFrame');
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fail=(d,text)=>{const out=d.getElementById('createMsg');if(out)out.innerHTML=`<div class="msg err">${esc(text)}</div>`};

  function addShare(d,w,{name,email,password,code}){
    const out=d.getElementById('createMsg');
    if(!out)return;
    const loginUrl=new URL('../partner-launch.html',w.location.href).href;
    const box=d.createElement('div');
    box.className='msg ok';
    box.style.marginTop='10px';
    box.innerHTML=`<b>Partner Login Ready</b><div style="margin-top:7px;line-height:1.6">Login: ${esc(loginUrl)}<br>Email: ${esc(email)}<br>Initial Password: ${esc(password)}</div><button type="button" id="sharePartnerAccess" class="wide" style="margin-top:10px">Share Partner Login</button>`;
    out.appendChild(box);
    box.querySelector('#sharePartnerAccess').onclick=async()=>{
      const text=['Evolution Optical Partner Login',name?`Partner: ${name}`:'',code?`Partner Code: ${code}`:'',`Login Email: ${email}`,`Initial Password: ${password}`,`Login: ${loginUrl}`].filter(Boolean).join('\n');
      try{
        if(w.navigator.share){await w.navigator.share({title:'Evolution Optical Partner Login',text,url:loginUrl});return}
        if(w.navigator.clipboard?.writeText){await w.navigator.clipboard.writeText(text);box.querySelector('#sharePartnerAccess').textContent='Copied';setTimeout(()=>box.querySelector('#sharePartnerAccess').textContent='Share Partner Login',1500);return}
      }catch(e){if(e?.name==='AbortError')return}
      w.location.href='https://wa.me/?text='+encodeURIComponent(text);
    };
  }

  function inject(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    const create=d.getElementById('createPartner');
    const staff=d.getElementById('pStaffLimit');
    if(!create||!staff)return;

    if(!d.getElementById('pInitialPassword')){
      const field=d.createElement('div');
      field.className='field';
      field.innerHTML='<label>Initial Password</label><input id="pInitialPassword" type="text" autocomplete="new-password" placeholder="Enter temporary password"><div class="small" style="margin-top:5px">Minimum 8 characters. This password is shared once with the Partner.</div>';
      staff.closest('.field')?.insertAdjacentElement('afterend',field);
    }

    create.onclick=async()=>{
      const get=id=>d.getElementById(id);
      const partner_name=(get('pName')?.value||'').trim();
      const contact_person=(get('pContact')?.value||'').trim();
      const contact_phone=(get('pPhone')?.value||'').trim();
      const email=(get('pEmail')?.value||'').trim().toLowerCase();
      const staff_limit=Number(get('pStaffLimit')?.value||0);
      const initial_password=(get('pInitialPassword')?.value||'').trim();
      const allocations=[...d.querySelectorAll('.voucherRow')].map(row=>({
        version_id:(row.querySelector('.vsel')?.value||'').trim(),
        quantity:Number(row.querySelector('.vqty')?.value||0)
      }));
      const out=get('createMsg');
      if(out)out.innerHTML='';
      if(!partner_name||!email)return fail(d,'Partner Name and Email are required.');
      if(initial_password.length<8)return fail(d,'Initial Password must be at least 8 characters.');
      if(!Number.isInteger(staff_limit)||staff_limit<0||staff_limit>1000)return fail(d,'Staff Limit must be 0 to 1000.');
      if(!allocations.length||allocations.some(x=>!x.version_id||!Number.isInteger(x.quantity)||x.quantity<1))return fail(d,'Select at least one valid Initial Voucher allocation.');

      const cfg=w.EVOLUTION_VOUCHER_BACKEND||{};
      if(!(cfg.supabaseUrl&&cfg.publishableKey&&w.supabase))return fail(d,'Backend unavailable.');
      const db=w.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey);
      create.disabled=true;create.textContent='Creating Partner…';
      try{
        const body={partner_code:'AUTO',partner_name,contact_person:contact_person||null,contact_phone:contact_phone||null,email,staff_limit,allocations,initial_password};
        const {data,error}=await db.functions.invoke('create-partner',{body});
        if(error)throw error;
        if(!data?.success)throw new Error(data?.details||data?.error||'Unable to create Partner');
        const actualCode=data?.partner?.partner_code||'';
        if(out)out.innerHTML=`<div class="msg ok">Partner ${esc(actualCode)} created successfully.</div>`;
        addShare(d,w,{name:partner_name,email,password:initial_password,code:actualCode});
        ['pName','pContact','pPhone','pEmail','pInitialPassword'].forEach(id=>{const el=get(id);if(el)el.value=''});
        if(get('pStaffLimit'))get('pStaffLimit').value='0';
        if(get('pCode'))get('pCode').value='—';
      }catch(e){fail(d,e?.message||'Unable to create Partner')}
      finally{create.disabled=false;create.textContent='Create Partner'}
    };
  }

  frame.addEventListener('load',()=>{let tries=0;const timer=setInterval(()=>{tries++;inject();if(frame.contentDocument?.getElementById('pInitialPassword')||tries>40)clearInterval(timer)},100)});
})();
</script>
</body>
</html>
