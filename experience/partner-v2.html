<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-store">
<title>Evolution Optical · Partner V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/backend-config.js?v=20260820-v2"></script>
<style>
:root{--bg:#060a18;--panel:#0b1430;--line:#263967;--text:#f7f9ff;--muted:#8d9aba;--yellow:#fff4b8;--cyan:#70e4ee}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d22,#050918);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}.page{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 28px}.top{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid #21325b}.brand{flex:1}.kicker{font-size:11px;letter-spacing:.22em;color:var(--cyan);font-weight:900}h1{font-size:28px;margin:4px 0 2px}.muted,.small{font-size:12px;color:var(--muted)}button,.btn{border:1px solid var(--line);background:#0e1936;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;text-decoration:none;cursor:pointer}.section{margin-top:16px}.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.title{font-size:16px;font-weight:900;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;color:#a9b5d6;font-weight:800;margin-bottom:6px}.field input,.field select,textarea{width:100%;min-height:52px;border:1px solid #b9aa63;border-radius:10px;background:var(--yellow);color:#191919;padding:12px;font-size:16px}.field input[readonly]{background:#eee7bc;color:#4e4a36}.wide{width:100%;margin-top:10px}.msg{margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:12px}.ok{color:#7ff0c0}.err{color:#ff9dac}.hidden{display:none!important}.listToggle{width:100%;min-height:54px;font-size:16px}.listBody{display:none;margin-top:10px}.listOpen .listBody{display:block}.partner{border:1px solid #2a3d6f;border-radius:13px;padding:12px;margin-top:10px;background:#09142d}.partnerhead{display:flex;gap:8px;align-items:center}.partnerhead>div{flex:1}.partnerhead b{font-size:17px}.badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.badge.active{color:#7ef5ff;border-color:#39d6df}.badge.suspended{color:#ff9aa8;border-color:#ff6b7d}.badge.archived{color:#c9a9ff;border-color:#a877ff}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.metric{background:#fff3bf;border:1px solid #e5d58f;border-radius:9px;padding:9px;color:#10162a}.metric span{display:block;color:#6d6543;font-size:10px}.metric b{font-size:18px;color:#10162a}.manage{width:100%;margin-top:9px;min-height:52px;font-size:14px}.detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #21325b}.partner.open .detail{display:block}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statusStack{display:grid;gap:8px}.statusStack button,.saveVL,.saveSL{min-height:52px;font-size:14px}.statusStack button.active{border-color:#39d6df}.statusStack button.suspended{border-color:#ff6b7d}.statusStack button.archived{border-color:#a877ff}.claim,.stock{margin-top:14px;padding:14px;border:1px solid #263967;border-radius:12px}.claim>b,.stock>b{font-size:16px}.branchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45;color:#dbe4ff}.check input{width:auto;min-width:20px;min-height:20px;margin-top:1px}.saveClaim{min-height:54px;font-size:14px}.allocation{padding:12px 0;border-top:1px solid #20305a}.allocgrid{display:grid;grid-template-columns:1.4fr repeat(3,.7fr);gap:8px}.cell{border:1px solid #24355f;border-radius:9px;padding:10px}.cell span{display:block;font-size:10px;color:var(--muted)}.cell b{display:block;margin-top:3px;font-size:16px}.revoke{display:grid;grid-template-columns:100px 1fr 100px;gap:8px;margin-top:10px}.revoke input{min-height:52px;border:1px solid #b9aa63;border-radius:10px;background:var(--yellow);color:#191919;padding:10px 12px;font-size:16px}.revoke button{min-height:52px;font-size:14px}.voucherRows{margin-top:12px}.voucherRow{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px}.voucherRow select,.voucherRow input{min-height:52px;border:1px solid #b9aa63;border-radius:10px;background:var(--yellow);color:#191919;padding:10px 12px;font-size:16px}.voucherRow button{min-height:52px;font-size:14px}.danger{border-color:#a43b55!important;background:#451320!important}.authbox{max-width:420px;margin:60px auto}.note{font-size:11px;color:#65708e;text-align:center;margin-top:15px}#search{min-height:52px;border:1px solid #b9aa63;border-radius:10px;background:var(--yellow);color:#191919;padding:10px 12px;font-size:16px}
@media(max-width:620px){.grid,.controls{grid-template-columns:1fr 1fr}.branchgrid{grid-template-columns:1fr}.allocgrid{grid-template-columns:1fr 1fr}.revoke,.voucherRow{grid-template-columns:1fr}.top{align-items:flex-start;flex-wrap:wrap}.brand{flex-basis:100%}}
@media(max-width:430px){.page{padding-left:12px;padding-right:12px}.grid{gap:10px}}
</style>
</head>
<body>
<main class="page">
<header class="top"><div class="brand"><div class="kicker">EVOLUTION OPTICAL</div><h1>Partner Management</h1><div id="identity" class="muted">Admin V2</div></div><a class="btn" href="admin-v2.html">← Admin</a><button id="signOut">Sign Out</button></header>
<section id="auth" class="authbox hidden"><div class="box"><div class="title">Admin Sign In</div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:8px"><label>Password</label><input id="password" type="password"></div><button id="signIn" class="wide">Sign In</button><div id="authMsg"></div></div></section>
<div id="app" class="hidden">
<section id="createSection" class="section box"><button id="createToggle" class="listToggle" type="button">Close Create Partner</button><div id="createBody" style="display:block;margin-top:10px"><div class="grid">
<div class="field"><label>Partner Code</label><input id="pCode" value="—" readonly aria-readonly="true"><div class="small" style="margin-top:5px">Auto-generated from Partner Name.</div></div>
<div class="field"><label>Partner Name</label><input id="pName"></div>
<div class="field"><label>Contact Person</label><input id="pContact"></div>
<div class="field"><label>Contact Phone</label><input id="pPhone"></div>
<div class="field"><label>Login Email</label><input id="pEmail" type="email"></div>
<div class="field"><label>Staff Limit</label><input id="pStaffLimit" type="number" min="0" value="0"></div>
</div><div class="voucherRows"><div class="small">Initial Voucher allocation is required.</div><div id="voucherAllocations"></div><button id="addVoucher" type="button" style="margin-top:7px">+ Add Voucher</button></div><button id="createPartner" class="wide">Create Partner</button><div id="createMsg"></div></div></section>
<section id="partnerSection" class="section box"><button id="partnerToggle" class="listToggle">Partner Controls</button><div id="partnerBody" class="listBody"><div class="grid"><input id="search" placeholder="Search Partner name or code"><button id="clear">Clear</button></div><div id="partners"></div><div id="partnerMsg"></div></div></section>
</div>
<div class="note">Partner V2 · self-contained</div>
</main>
<script>
(()=>{
const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},$=id=>document.getElementById(id);
if(!(cfg.enabled&&cfg.supabaseUrl&&cfg.publishableKey&&window.supabase)){document.body.innerHTML='<div class="authbox box">Backend unavailable.</div>';return}
const db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey);
let partnerRows=[],reportRows=[],branches=[],versions=[],allocations=[],allocationData=[],previewSeq=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(id,t,ok=false)=>$(id).innerHTML=t?`<div class="msg ${ok?'ok':'err'}">${esc(t)}</div>`:'';
async function rpc(n,a={}){const{data,error}=await db.rpc(n,a);if(error)throw error;return data}
async function verify(){const{data}=await db.auth.getSession();const s=data?.session;if(!s){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return false}const r=await rpc('current_operational_realm');if(r?.realm!=='admin')throw new Error('Admin access required');$('identity').textContent=(s.user.email||s.user.id)+' · Partner V2';$('auth').classList.add('hidden');$('app').classList.remove('hidden');return true}
function scrollSection(section){requestAnimationFrame(()=>{const y=section.getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top:Math.max(0,y),behavior:'smooth'})})}
function setCreateOpen(open,scroll=false){$('createBody').style.display=open?'block':'none';$('createToggle').textContent=open?'Close Create Partner':'Create Partner';if(open&&scroll)scrollSection($('createSection'))}
function setPartnerOpen(open,scroll=true){$('partnerSection').classList.toggle('listOpen',open);$('partnerBody').style.display=open?'block':'none';$('partnerToggle').textContent=open?'Close Partner Controls':'Partner Controls';if(open){setCreateOpen(false);if(scroll)scrollSection($('partnerSection'))}else{setCreateOpen(true,scroll)}}
async function previewPartnerCode(){const seq=++previewSeq,name=$('pName').value.trim();if(!name){$('pCode').value='—';return}try{const code=await rpc('admin_preview_partner_code',{p_partner_name:name});if(seq!==previewSeq)return;$('pCode').value=code||'—'}catch(_){if(seq===previewSeq)$('pCode').value='—'}}
function renderVoucherPicker(){const opts=versions.map(v=>`<option value="${esc(v.version_id)}">${esc(v.voucher_label||v.version_name||v.template_name||'Voucher Version')}</option>`).join('');$('voucherAllocations').innerHTML=allocations.map((x,i)=>`<div class="voucherRow"><select data-i="${i}" class="vsel"><option value="">Select Voucher Version</option>${opts}</select><input data-i="${i}" class="vqty" type="number" min="1" value="${x.quantity||1}"><button data-i="${i}" class="vremove" type="button">Remove Voucher Code</button></div>`).join('');allocations.forEach((x,i)=>{const s=document.querySelector(`.vsel[data-i="${i}"]`);if(s)s.value=x.version_id||''});document.querySelectorAll('.vsel').forEach(x=>x.onchange=()=>allocations[+x.dataset.i].version_id=x.value);document.querySelectorAll('.vqty').forEach(x=>x.oninput=()=>allocations[+x.dataset.i].quantity=Number(x.value));document.querySelectorAll('.vremove').forEach(x=>x.onclick=()=>{allocations.splice(+x.dataset.i,1);renderVoucherPicker()})}
function metricsFor(id){const r=reportRows.find(x=>x.partner_id===id)||{};return{issued:Number(r.vouchers_issued||0),remaining:Number(r.allocation_remaining||0),allocated:Number(r.vouchers_allocated||0)}}
async function loadClaim(id,node){const a=await rpc('admin_get_partner_claim_access',{p_partner_id:id}),sel=new Set(a.branch_codes||[]),all=!!a.all_branches;node.innerHTML=`<b>Claim Branch</b><label class="check" style="margin-top:10px"><input class="all" type="checkbox" ${all?'checked':''}><span>All active branches</span></label><div class="branchgrid">${branches.map(b=>`<label class="check"><input class="bc" type="checkbox" value="${esc(b.branch_code)}" ${sel.has(b.branch_code)?'checked':''}><span>${esc(b.branch_name)} (${esc(b.branch_code)})</span></label>`).join('')}</div><button class="saveClaim wide">Save Claim Access</button>`;const sync=()=>node.querySelectorAll('.bc').forEach(x=>x.disabled=node.querySelector('.all').checked);node.querySelector('.all').onchange=sync;sync();node.querySelector('.saveClaim').onclick=async()=>{try{const all=node.querySelector('.all').checked,codes=[...node.querySelectorAll('.bc:checked')].map(x=>x.value);if(!all&&!codes.length)throw new Error('Select at least one branch.');await rpc('admin_set_partner_claim_access',{p_partner_id:id,p_all_branches:all,p_branch_codes:codes});msg('partnerMsg','Claim access updated.',true)}catch(e){msg('partnerMsg',e.message)}}}
const allocationsCache=()=>allocationData;
async function loadStock(code,node){node.innerHTML='<b>Allocated Voucher Stock</b><div class="small" style="margin-top:4px">Revoke only unissued stock.</div>';const rows=allocationsCache().filter(x=>String(x.partner_code||'').toUpperCase()===String(code).toUpperCase());if(!rows.length){node.innerHTML+='<div class="small" style="margin-top:9px">No active allocations.</div>';return}for(const r of rows){const rem=Number(r.remaining_unissued||0),d=document.createElement('div'),v=versions.find(x=>String(x.version_id)===String(r.version_id)),displayName=v?.voucher_label||v?.version_name||v?.template_name||r.version_name||'Voucher Version';d.className='allocation';d.innerHTML=`<div class="allocgrid"><div class="cell"><span>Version</span><b>${esc(displayName)}</b></div><div class="cell"><span>Allocated</span><b>${Number(r.quantity_allocated||0)}</b></div><div class="cell"><span>Issued</span><b>${Number(r.issued_count||0)}</b></div><div class="cell"><span>Unissued</span><b>${rem}</b></div></div>${rem>0?`<div class="revoke"><input class="qty" type="number" min="1" max="${rem}" placeholder="Qty"><input class="reason" placeholder="Reason"><button class="danger rev">Revoke</button></div>`:''}`;node.appendChild(d);if(rem>0)d.querySelector('.rev').onclick=async()=>{const q=Number(d.querySelector('.qty').value),reason=d.querySelector('.reason').value.trim();if(!Number.isInteger(q)||q<1||q>rem)return alert('Enter a valid quantity.');if(!reason)return alert('Reason is required.');if(!confirm(`Revoke ${q} unissued voucher(s)?`))return;const{error}=await db.rpc('admin_engine_revoke_unissued',{p_allocation_id:r.allocation_id,p_quantity:q,p_reason:reason,p_actor_user_id:null});if(error)return alert(error.message);await loadAll();alert('Unissued voucher stock revoked.')}}}
function renderPartners(){const q=$('search').value.trim().toLowerCase(),rows=partnerRows.filter(p=>!q||String(p.partner_name||'').toLowerCase().includes(q)||String(p.partner_code||'').toLowerCase().includes(q)).sort((a,b)=>{const byName=String(a.partner_name||'').localeCompare(String(b.partner_name||''),undefined,{sensitivity:'base',numeric:true});return byName||String(a.partner_code||'').localeCompare(String(b.partner_code||''),undefined,{sensitivity:'base',numeric:true})});$('partners').innerHTML=rows.map(p=>{const m=metricsFor(p.partner_id),st=String(p.partner_status||'active');return`<div class="partner" data-id="${p.partner_id}" data-code="${esc(p.partner_code)}"><div class="partnerhead"><div><b>${esc(p.partner_name)}</b><div class="small">${esc(p.partner_code)}</div></div><span class="badge ${st}">${esc(st)}</span></div><div class="metrics"><div class="metric"><span>Allocated</span><b>${m.allocated}</b></div><div class="metric"><span>Issued</span><b>${m.issued}</b></div><div class="metric"><span>Remaining</span><b>${m.remaining}</b></div></div><button class="manage">Manage</button><div class="detail"><div class="controls"><div><div class="field"><label>Status</label></div><div class="statusStack"><button data-status="active" class="active">Active</button><button data-status="suspended" class="suspended">Suspend</button><button data-status="archived" class="archived">Archive</button></div></div><div><div class="field"><label>Voucher Limit (0 = unlimited)</label><input class="vl" type="number" min="0" value="${Number(p.voucher_limit||0)}"></div><button class="saveVL wide">Save Voucher Limit</button></div><div><div class="field"><label>Staff Limit</label><input class="sl" type="number" min="0" max="1000" value="${Number(p.staff_limit||0)}"></div><button class="saveSL wide">Save Staff Limit</button></div><div><div class="field"><label>Partner Staff</label></div><div class="msg">${Number(p.partner_staff_count||0)} / ${Number(p.staff_limit||0)}</div></div></div><div class="claim"></div><div class="stock"></div></div></div>`}).join('')||'<div class="small">No Partners found.</div>';document.querySelectorAll('.partner').forEach(card=>{const id=card.dataset.id,code=card.dataset.code;card.querySelector('.manage').onclick=async()=>{const opening=!card.classList.contains('open');document.querySelectorAll('.partner.open').forEach(x=>x.classList.remove('open'));if(opening){card.classList.add('open');await Promise.all([loadClaim(id,card.querySelector('.claim')),loadStock(code,card.querySelector('.stock'))])}};card.querySelectorAll('[data-status]').forEach(b=>b.onclick=async()=>{if(!confirm('Set Partner status to '+b.dataset.status+'?'))return;try{await rpc('admin_set_partner_status',{p_partner_id:id,p_status:b.dataset.status});await loadAll()}catch(e){msg('partnerMsg',e.message)}});card.querySelector('.saveVL').onclick=async()=>{try{const n=Number(card.querySelector('.vl').value);if(!Number.isInteger(n)||n<0)throw new Error('Voucher limit must be zero or greater.');await rpc('admin_set_partner_voucher_limit',{p_partner_id:id,p_voucher_limit:n});const p=partnerRows.find(x=>x.partner_id===id);if(p)p.voucher_limit=n;msg('partnerMsg','Voucher limit updated.',true)}catch(e){msg('partnerMsg',e.message)}};card.querySelector('.saveSL').onclick=async()=>{try{const n=Number(card.querySelector('.sl').value);if(!Number.isInteger(n)||n<0||n>1000)throw new Error('Staff limit must be 0 to 1000.');await rpc('admin_set_partner_staff_limit',{p_partner_id:id,p_staff_limit:n});const p=partnerRows.find(x=>x.partner_id===id);if(p)p.staff_limit=n;msg('partnerMsg','Staff limit updated.',true)}catch(e){msg('partnerMsg',e.message)}}})}
async function loadAll(){[partnerRows,reportRows,branches,versions,allocationData]=await Promise.all([rpc('admin_partner_directory'),rpc('admin_partner_reporting_summary'),rpc('admin_active_branches'),rpc('admin_active_voucher_versions'),rpc('admin_active_voucher_allocations')]);renderPartners();if(!allocations.length){allocations=[{version_id:'',quantity:1}];renderVoucherPicker()}if($('pName').value.trim())previewPartnerCode()}
$('pName').oninput=()=>{clearTimeout($('pName')._previewTimer);$('pCode').value=$('pName').value.trim()?'…':'—';$('pName')._previewTimer=setTimeout(previewPartnerCode,220)};
$('addVoucher').onclick=()=>{allocations.push({version_id:'',quantity:1});renderVoucherPicker()};
$('createPartner').onclick=async()=>{const btn=$('createPartner');btn.disabled=true;msg('createMsg','');try{const body={partner_code:'AUTO',partner_name:$('pName').value.trim(),contact_person:$('pContact').value.trim(),contact_phone:$('pPhone').value.trim(),email:$('pEmail').value.trim().toLowerCase(),staff_limit:Number($('pStaffLimit').value||0),allocations:allocations.map(x=>({version_id:x.version_id,quantity:Number(x.quantity)}))};if(!body.partner_name||!body.email)throw new Error('Partner Name and Email are required.');if(!body.allocations.length||body.allocations.some(x=>!x.version_id||!Number.isInteger(x.quantity)||x.quantity<1))throw new Error('Select at least one valid Initial Voucher allocation.');const{data,error}=await db.functions.invoke('create-partner',{body});if(error)throw error;if(!data?.success)throw new Error(data?.details||data?.error||'Unable to create Partner');const actualCode=data?.partner?.partner_code||$('pCode').value;msg('createMsg',`Partner ${actualCode&&actualCode!=='—'?actualCode+' ':''}created. Initial password: ${data.temporary_password||'EVO12345678'}`,true);['pName','pContact','pPhone','pEmail'].forEach(id=>$(id).value='');$('pCode').value='—';$('pStaffLimit').value='0';allocations=[{version_id:'',quantity:1}];await loadAll()}catch(e){msg('createMsg',e.message||'Unable to create Partner')}finally{btn.disabled=false}};
$('createToggle').onclick=()=>{const opening=$('createBody').style.display==='none';if(opening&&$('partnerSection').classList.contains('listOpen'))setPartnerOpen(false,false);setCreateOpen(opening,opening)};
$('partnerToggle').onclick=()=>setPartnerOpen(!$('partnerSection').classList.contains('listOpen'));
$('search').oninput=renderPartners;$('clear').onclick=()=>{$('search').value='';renderPartners()};$('signIn').onclick=async()=>{try{const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await verify();await loadAll()}catch(e){msg('authMsg',e.message)}};$('signOut').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(async()=>{try{if(await verify())await loadAll()}catch(e){msg('authMsg',e.message);$('auth').classList.remove('hidden')}})
})();
</script>
</body>
</html>
