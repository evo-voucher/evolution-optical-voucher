<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/backend-config.js?v=20260820-b5"></script></head><body style="margin:0;background:#060a18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><div style="padding:32px;text-align:center">Opening Admin…</div><script>(async()=>{const c=window.EVOLUTION_VOUCHER_BACKEND||{};if(!(c.enabled&&c.supabaseUrl&&c.publishableKey&&window.supabase)){location.replace('admin-login-b.html');return}const db=window.supabase.createClient(c.supabaseUrl,c.publishableKey);const{data}=await db.auth.getSession();if(!data?.session){location.replace('admin-login-b.html');return}try{const{data:r,error}=await db.rpc('current_operational_realm');if(error||!r?.authenticated||r?.realm!=='admin'){await db.auth.signOut({scope:'local'});location.replace('admin-login-b.html');return}location.replace('admin-b-final.html')}catch(_){location.replace('admin-login-b.html')}})();</script></body></html>
