<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071127"><title>Evolution Optical • Admin Sign In</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/backend-config.js?v=20260820-b5"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071127;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;padding:18px}.shell{width:min(760px,100%);margin:0 auto}.card{padding:28px 22px;border-radius:26px;background:linear-gradient(145deg,#1b1a50,#0a1d43 65%,#06152f);border:1px solid rgba(118,91,255,.78);box-shadow:0 20px 50px rgba(0,0,0,.28)}h1{margin:0 0 8px;font:500 clamp(34px,8vw,54px) Georgia,"Times New Roman",serif;letter-spacing:.05em;line-height:1.08}p{margin:0 0 24px;color:#d65af0;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.field{margin-top:18px}label{display:block;margin-bottom:8px;font-size:16px;font-weight:800}input{display:block;width:100%;min-height:58px;padding:13px 16px;border:1px solid #d8cf74;border-radius:18px;background:#fff8a8;color:#151515;font-size:16px;outline:none}input::placeholder{color:#746f49}button{width:100%;min-height:58px;margin-top:28px;border:1px solid rgba(141,92,255,.95);border-radius:18px;background:linear-gradient(180deg,#4d60c9,#182d72);color:#fff;font-size:18px;font-weight:900}.msg{margin-top:14px;padding:12px 14px;border-radius:14px;background:#34141d;color:#ffb4be;border:1px solid #b44c59}.loading{opacity:.6}.note{margin-top:14px;color:#8fa0c8;font-size:12px;text-align:center}@media(max-width:560px){body{padding:18px 14px}.card{padding:26px 18px}}</style></head><body><main class="shell"><section class="card"><h1>EVOLUTION<br>OPTICAL</h1><p>Admin Voucher Portal</p><div class="field"><label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">Sign In</button><div id="msg"></div><div class="note">B5 experience login → Admin B Dashboard</div></section></main><script>(()=>{const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},out=document.getElementById('msg'),btn=document.getElementById('loginBtn');if(!(cfg.enabled&&cfg.supabaseUrl&&cfg.publishableKey&&window.supabase)){out.innerHTML='<div class="msg">Backend configuration unavailable.</div>';return}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true}});const show=t=>out.innerHTML=t?`<div class="msg">${String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`:'';btn.addEventListener('click',async()=>{const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value;if(!email||!password){show('Enter email and password.');return}btn.disabled=true;btn.classList.add('loading');show('');try{const{error}=await db.auth.signInWithPassword({email,password});if(error)throw error;const{data:realm,error:realmError}=await db.rpc('current_operational_realm');if(realmError)throw realmError;if(!realm||realm.authenticated!==true||realm.realm!=='admin'){await db.auth.signOut({scope:'local'});throw new Error('This account is not an active Evolution Voucher Admin.')}location.replace('admin-b-revoke.html')}catch(e){show(e?.message||'Sign in failed.');btn.disabled=false;btn.classList.remove('loading')}})})();</script></body></html>
