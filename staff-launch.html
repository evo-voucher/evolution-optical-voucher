<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#08122f"><title>Staff</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 40%,#182660 0,#08122f 42%,#020611 100%)}.wrap{height:100%;display:grid;place-items:center;position:relative}.halo{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(112,74,255,.32),rgba(23,183,255,.08) 48%,transparent 72%);filter:blur(4px)}img{width:132px;height:132px;border-radius:29px;position:relative;z-index:2;box-shadow:0 20px 60px rgba(0,0,0,.38)}.name{position:absolute;bottom:11vh;color:#dfe8ff;font-size:15px;font-weight:700;letter-spacing:.08em;opacity:.82}.bar{position:absolute;bottom:7.5vh;width:90px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}.bar:after{content:"";display:block;height:100%;width:55%;background:linear-gradient(90deg,#8d5cff,#18c8ff)}</style></head><body><div class="wrap"><div class="halo"></div><img src="staff-icon-180.png" alt="Staff"><div class="name">EVOLUTION OPTICAL · STAFF</div><div class="bar"></div></div><script>(async()=>{const q=new URLSearchParams(location.search);const cleaned=q.get('cleaned')==='1';if(!cleaned){try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)))}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))} }catch(_){}const u=new URL(location.href);u.searchParams.set('cleaned','1');u.searchParams.set('t',Date.now());location.replace(u.toString());return;}setTimeout(()=>location.replace(`staff.html?v=${Date.now()}&fresh=1`),300)})();</script></body></html>
