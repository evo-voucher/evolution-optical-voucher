<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical • Voucher Classifications</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/backend-config.js"></script>
<style>
:root{--ink:#f7f8ff;--muted:#aebddd;--line:rgba(115,135,210,.34);--ok:#65e6b5;--err:#ff92a5;--warn:#ffd98c;--panel:#0d1839}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(980px,100%);margin:auto}.card{padding:22px;border-radius:22px;background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:14px}h1{margin:0 0 8px;font:500 30px Georgia,serif}h2{margin:0 0 12px;font-size:19px}p,.small{color:var(--muted);line-height:1.55}.small{font-size:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.top a{color:#bfd0ff;text-decoration:none}.msg,.status{margin-top:12px;padding:11px 13px;border-radius:13px;background:#101b44;border:1px solid var(--line);font-weight:700}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}.hidden{display:none!important}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:690px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid rgba(115,135,210,.18);font-size:12px}th{color:#dce6ff;background:#0b1738}td{color:#c2d0ee}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#101b44;border:1px solid var(--line);font-size:11px;font-weight:800}button{min-height:42px;border:1px solid rgba(122,119,255,.7);border-radius:12px;background:linear-gradient(180deg,#3549a8,#182b73 58%,#0d1c4c);color:#fff;font-weight:900;cursor:pointer;padding:9px 12px}button:disabled{opacity:.55}.archiveBtn{border-color:rgba(255,146,165,.55);background:linear-gradient(180deg,#7e3145,#4d1f2d)}@media(max-width:700px){body{padding:12px}.card{padding:17px}.top{flex-direction:column}h1{font-size:26px}}
</style>
</head>
<body><main class="shell">
<section class="card"><div class="top"><div><h1>EVOLUTION OPTICAL</h1><p>Voucher Classification Management</p></div><a href="voucher-engine.html">← Back to Voucher Engine</a></div><div id="accessMsg" class="status">Checking Admin access…</div></section>
<section id="content" class="card hidden"><h2>Voucher Classifications</h2><div class="small">Archive stops future use without deleting historical Vouchers. Active Versions are retired and active allocations for the Classification are closed.</div><div id="table" class="tableWrap"></div><div id="msg"></div></section>
</main>
<script>
(()=>{
const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{storageKey:'evolution-voucher-auth-admin-v2',persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let rows=[];
async function rpc(name,args={}){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function load(){
  const realm=await rpc('current_operational_realm');
  if(!realm?.authenticated||realm.realm!=='admin'){location.href='admin.html';return}
  $('accessMsg').textContent='Admin identity verified.';$('accessMsg').className='msg ok';$('content').classList.remove('hidden');
  const{data,error}=await db.from('voucher_templates').select('id,template_code,template_name,voucher_category,status,created_at').order('created_at',{ascending:false});if(error)throw error;rows=data||[];render();
}
function render(){$('table').innerHTML=!rows.length?'<div class="small" style="padding:12px">No classifications.</div>':`<table><thead><tr><th>Code</th><th>Name</th><th>Category</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.template_code)}</b></td><td>${esc(r.template_name)}</td><td>${esc(r.voucher_category||'')}</td><td><span class="pill">${esc(r.status)}</span></td><td>${r.status==='archived'?'<span class="small">Archived</span>':`<button class="archiveBtn" data-id="${esc(r.id)}" data-code="${esc(r.template_code)}">Archive</button>`}</td></tr>`).join('')}</tbody></table>`}
async function archive(btn){const id=btn.dataset.id,code=btn.dataset.code;if(!confirm(`Archive ${code}?\n\nHistorical Vouchers will remain valid according to their existing status and expiry. Active Versions will be retired and active allocations will be closed.`))return;btn.disabled=true;$('msg').innerHTML='';try{const data=await rpc('admin_archive_voucher_template',{p_template_id:id,p_reason:'Archived from Classification Management'});$('msg').innerHTML=`<div class="msg ok">${esc(code)} archived. Historical Vouchers preserved. Retired Versions: ${Number(data?.versions_retired||0)}. Closed allocations: ${Number(data?.allocations_closed||0)}.</div>`;await load()}catch(e){$('msg').innerHTML=`<div class="msg err">${esc(e.message||'Archive failed.')}</div>`;btn.disabled=false}}
$('table').addEventListener('click',e=>{const btn=e.target.closest('[data-id]');if(btn)archive(btn)});
load().catch(e=>{$('accessMsg').textContent=e.message||'Unable to load classifications.';$('accessMsg').className='msg err'});
})();
</script>
</body></html>
