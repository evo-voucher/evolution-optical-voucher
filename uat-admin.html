ealm!=='admin'){msg(re?.message||'Admin realm verification failed');return}$('login').classList.add('hidden');$('create').classList.remove('hidden');msg('Admin verified: '+(data.user?.email||''))};$('createBtn').onclick=async()=>{msg('Creating test Partner…');const{data:{session}}=await db.auth.getSession();if(!session){msg('Admin session missing');return}const{data,error}=await db.functions.invoke('create-partner',{body:{partner_code:$('code').value.trim(),partner_name:$('name').value.trim(),email:$('pemail').value.trim(),password:$('ppassword').value,voucher_limit:Number($('vlimit').value||0),staff_limit:Number($('slimit').value||0)}});if(error){msg('Function error: '+error.message);return}msg(JSON.stringify(data,null,2))};})();</script></body></html>
