<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical • District Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/backend-config.js?v=20260907-district1"></script>
<style>
:root{--ink:#f7f8ff;--muted:#9fb1d9;--line:rgba(115,135,210,.34);--ok:#65e6b5;--err:#ff92a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(760px,100%);margin:auto}.card{padding:20px;border-radius:20px;background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);margin-bottom:14px}.top{display:flex;align-items:center;gap:10px}.top>div{flex:1}h1{margin:0;font-size:25px}p{color:var(--muted);line-height:1.5}.field{margin-top:12px}label{display:block;margin-bottom:6px;font-size:12px;font-weight:800}input{width:100%;min-height:46px;padding:10px 12px;border:1px solid #d8cf74;border-radius:12px;background:#fff8a8;color:#151515;font-size:16px}button,.btn{min-height:42px;border:1px solid rgba(122,119,255,.7);border-radius:12px;background:linear-gradient(180deg,#3549a8,#182b73 58%,#0d1c4c);color:#fff;font-weight:900;padding:9px 12px;text-decoration:none;cursor:pointer}.wide{width:100%;margin-top:12px}.hidden{display:none!important}.msg{margin-top:10px;padding:10px;border-radius:11px;background:#0d1839;color:var(--muted)}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}.row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(115,135,210,.22)}.actions{display:flex;gap:6px}.actions button{min-width:42px}.muted{font-size:12px;color:var(--muted)}@media(max-width:560px){.row{grid-template-columns:30px 1fr}.actions{grid-column:2;flex-wrap:wrap}.actions button{flex:1}.top{align-items:flex-start}}
</style>
</head>
<body>
<main class="shell">
<section class="card">
  <div class="top"><div><div class="muted">EVOLUTION OPTICAL</div><h1>District Management</h1></div><a class="btn" href="admin.html">← Admin</a></div>
  <p>Add Districts, change their order, or make them inactive. Existing Voucher/QR/Theme rendering is not modified here.</p>
  <div id="authMsg" class="msg">Checking Admin session…</div>
</section>
<section id="manager" class="card hidden">
  <button id="toggleAdd" class="wide">＋ Add District</button>
  <div id="addPanel" class="hidden">
    <div class="field"><label>District Name</label><input id="districtName" placeholder="e.g. Puchong"></div>
    <button id="saveDistrict" class="wide">Save District</button>
  </div>
  <div id="districtMsg" class="msg"></div>
  <div id="districtList"></div>
</section>
</main>
<script>
(()=>{
const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},$=id=>document.getElementById(id);if(!window.supabase?.createClient||!cfg.supabaseUrl||!cfg.publishableKey){$('authMsg').textContent='Backend not configured.';return}const db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey,{auth:{persistSession:true}}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,args={}){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function verify(){const{data:s}=await db.auth.getSession();if(!s?.session)throw new Error('Please sign in through Admin first.');const realm=await rpc('current_operational_realm');if(realm?.realm!=='admin')throw new Error('Admin access required.');$('authMsg').textContent='Admin verified ✓';$('authMsg').className='msg ok';$('manager').classList.remove('hidden')}
async function load(){try{const rows=await rpc('admin_customer_district_directory');$('districtList').innerHTML=(rows||[]).map((r,i)=>`<div class="row"><b>${i+1}</b><div><div>${esc(r.district_name)}</div><div class="muted">${esc(r.district_status||'active')}</div></div><div class="actions"><button data-move="up" data-id="${r.district_id}" ${i===0?'disabled':''}>↑</button><button data-move="down" data-id="${r.district_id}" ${i===rows.length-1?'disabled':''}>↓</button><button data-status="${r.district_status==='active'?'inactive':'active'}" data-id="${r.district_id}">${r.district_status==='active'?'Inactive':'Active'}</button></div></div>`).join('')||'<div class="msg">No districts.</div>';$('districtMsg').textContent=`${rows.length} District(s)`}catch(e){$('districtMsg').textContent=e.message||'Unable to load Districts';$('districtMsg').className='msg err'}}
$('toggleAdd').onclick=()=>{$('addPanel').classList.toggle('hidden');$('toggleAdd').textContent=$('addPanel').classList.contains('hidden')?'＋ Add District':'− Close Add District';if(!$('addPanel').classList.contains('hidden'))$('districtName').focus()};
$('saveDistrict').onclick=async()=>{const name=$('districtName').value.trim();if(!name)return;$('saveDistrict').disabled=true;try{await rpc('admin_add_customer_district',{p_district_name:name});$('districtName').value='';$('addPanel').classList.add('hidden');$('toggleAdd').textContent='＋ Add District';$('districtMsg').textContent=`${name} added ✓`;$('districtMsg').className='msg ok';await load()}catch(e){$('districtMsg').textContent=e.message||'Unable to add District';$('districtMsg').className='msg err'}finally{$('saveDistrict').disabled=false}};
$('districtList').onclick=async e=>{const b=e.target.closest('button');if(!b)return;b.disabled=true;try{if(b.dataset.move)await rpc('admin_move_customer_district',{p_district_id:b.dataset.id,p_direction:b.dataset.move});else await rpc('admin_set_customer_district_status',{p_district_id:b.dataset.id,p_status:b.dataset.status});await load()}catch(x){$('districtMsg').textContent=x.message||'Unable to update District';$('districtMsg').className='msg err'}finally{b.disabled=false}};
verify().then(load).catch(e=>{$('authMsg').textContent=e.message||'Admin verification failed.';$('authMsg').className='msg err'});
})();
</script>
</body>
</html>
