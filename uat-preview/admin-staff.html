<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f">
<title>Evolution Optical • Admin Staff</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/backend-config.js"></script>
<style>
:root{--ink:#f7f8ff;--muted:#bcc7e3;--line:rgba(115,135,210,.34);--ok:#65e6b5;--err:#ff92a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(820px,100%);margin:auto}.card{padding:22px;border-radius:22px;background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);box-shadow:0 20px 60px rgba(0,0,0,.28);margin-bottom:14px}h1{margin:0 0 8px;font:500 30px Georgia,serif;letter-spacing:1.5px}h2{margin:0 0 12px;font-size:19px}p{color:var(--muted);line-height:1.55}.field{margin-top:12px}label{display:block;margin-bottom:6px;font-size:12px;font-weight:800;color:#d9e3ff}input,select{width:100%;min-height:46px;padding:10px 12px;border:1px solid rgba(100,128,210,.55);border-radius:13px;outline:none;background:#0d1839;color:#fff}button{min-height:44px;border:1px solid rgba(122,119,255,.7);border-radius:12px;background:linear-gradient(180deg,#3549a8,#182b73 58%,#0d1c4c);color:#fff;font-weight:900;cursor:pointer;padding:9px 12px}button:disabled{opacity:.55}.wide{width:100%;margin-top:14px}.msg,.status{margin-top:12px;padding:11px 13px;border-radius:13px;background:#101b44;border:1px solid var(--line);font-weight:700}.ok{color:var(--ok)}.err{color:var(--err)}.small{font-size:12px;color:#91a2c4}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top a{color:#bfd0ff;text-decoration:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="shell">
<section class="card"><div class="top"><div><h1>EVOLUTION OPTICAL</h1><p>Admin Staff Provisioning</p></div><a href="admin.html">Back to Admin Portal</a></div>
<section id="closedState"><div class="status">New backend not configured. Staff provisioning remains disabled for safety.</div></section>
<section id="loginState" class="hidden"><div class="field"><label>Admin Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="wide">Sign In</button><div id="loginMsg"></div></section>
<section id="adminState" class="hidden"><div class="msg ok">Admin identity verified.</div><div id="sessionMeta" class="small"></div></section></section>
<section id="provisionState" class="card hidden"><h2>Create Evolution Staff</h2><p class="small">The browser uses the trusted <code>create-staff</code> Edge Function. Service-role credentials never enter this page.</p><div class="grid"><div class="field"><label>Staff Name</label><input id="staffName"></div><div class="field"><label>Login Email</label><input id="staffEmail" type="email" autocomplete="off"></div><div class="field"><label>Temporary Password</label><input id="staffPassword" type="password" autocomplete="new-password"></div><div class="field"><label>Branch</label><select id="staffBranch"><option value="">Select branch</option></select></div><div class="field"><label>Role</label><select id="staffRole"><option value="staff">Staff</option><option value="manager">Branch Manager</option></select></div></div><button id="createBtn" class="wide">Create Evolution Staff</button><div id="createMsg"></div></section>
</main>
<script>
(()=>{const cfg=window.EVOLUTION_VOUCHER_BACKEND||{},$=id=>document.getElementById(id);const configured=cfg.enabled===true&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cfg.supabaseUrl||'')&&typeof cfg.publishableKey==='string'&&cfg.publishableKey.length>20&&typeof cfg.projectId==='string'&&cfg.projectId.length>5;if(!configured)return;$('closedState').classList.add('hidden');$('loginState').classList.remove('hidden');const db=window.supabase.createClient(cfg.supabaseUrl,cfg.publishableKey);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(node,text,ok=false)=>node.innerHTML=text?`<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`:'';
async function rpc(name,args={}){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function loadBranches(){const rows=await rpc('admin_active_branches');$('staffBranch').innerHTML='<option value="">Select active branch</option>'+((rows||[]).map(b=>`<option value="${esc(b.branch_id||b.id)}">${esc(b.branch_name)} (${esc(b.branch_code)})</option>`).join(''))}
async function verifyAdmin(session){if(!session?.user)return false;const realm=await rpc('current_operational_realm');if(!realm||realm.authenticated!==true||realm.realm!=='admin'){await db.auth.signOut();throw new Error('This account is not an active Evolution Voucher Admin.')}$('loginState').classList.add('hidden');$('adminState').classList.remove('hidden');$('provisionState').classList.remove('hidden');$('sessionMeta').textContent=`Signed in as ${session.user.email||session.user.id}`;await loadBranches();return true}
$('loginBtn').addEventListener('click',async()=>{const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){msg($('loginMsg'),'Enter email and password.');return}$('loginBtn').disabled=true;try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await verifyAdmin(data.session)}catch(e){msg($('loginMsg'),e.message||'Sign in failed.')}finally{$('loginBtn').disabled=false}});
$('createBtn').addEventListener('click',async()=>{const staff_name=$('staffName').value.trim(),email=$('staffEmail').value.trim().toLowerCase(),password=$('staffPassword').value,branch_id=$('staffBranch').value,role=$('staffRole').value;msg($('createMsg'),'');if(!staff_name||!email||!password||!branch_id){msg($('createMsg'),'Staff name, login email, password and branch are required.');return}if(!email.includes('@')){msg($('createMsg'),'Enter a valid Staff login email.');return}if(password.length<6){msg($('createMsg'),'Password must be at least 6 characters.');return}if(!['staff','manager'].includes(role)){msg($('createMsg'),'Unsupported Staff role.');return}$('createBtn').disabled=true;try{const{data,error}=await db.functions.invoke('create-staff',{body:{staff_name,email,password,branch_id,role}});if(error)throw error;if(!data?.success)throw new Error(data?.details||data?.error||'Staff creation failed.');msg($('createMsg'),`${role==='manager'?'Branch Manager':'Staff'} ${staff_name} created successfully.`,true);$('staffName').value='';$('staffEmail').value='';$('staffPassword').value='';$('staffBranch').value='';$('staffRole').value='staff'}catch(e){msg($('createMsg'),e.message||'Staff creation failed.')}finally{$('createBtn').disabled=false}});
db.auth.getSession().then(async({data})=>{if(data?.session){try{await verifyAdmin(data.session)}catch(e){msg($('loginMsg'),e.message||'Session verification failed.')}}});})();
</script>
</body></html>
