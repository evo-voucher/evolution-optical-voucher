<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical Voucher</title>
<script src="assets/js/backend-config.js"></script>
<style>
:root{--ink:#f7f8ff;--muted:#bcc7e3;--line:rgba(115,135,210,.34);--soft:#101b44;--ok:#65e6b5;--warn:#ffd48a}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;background:linear-gradient(160deg,#050716,#08102b 52%,#040816);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(680px,100%);padding:28px;border-radius:24px;background:linear-gradient(155deg,#171746,#0b1b42 58%,#06132f);border:1px solid rgba(122,119,255,.55);box-shadow:0 20px 60px rgba(0,0,0,.42)}h1{margin:0 0 8px;font:500 30px Georgia,serif;letter-spacing:1.5px}h2{font-size:16px;margin:22px 0 10px}p{color:var(--muted);line-height:1.6}.status{margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-weight:700}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.small{font-size:12px;color:#91a2c4}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.grid.admin{grid-template-columns:repeat(2,minmax(0,1fr))}a{display:flex;min-height:58px;align-items:center;justify-content:center;text-align:center;padding:12px;border:1px solid rgba(122,119,255,.6);border-radius:15px;background:linear-gradient(180deg,#263b91,#14265f);color:#fff;font-weight:900;text-decoration:none}.meta{margin-top:16px;font-size:11px;color:#8294bd;word-break:break-word}@media(max-width:620px){.grid,.grid.admin{grid-template-columns:1fr}}
</style>
</head>
<body><main class="card">
<h1>EVOLUTION OPTICAL</h1>
<p>Voucher System</p>
<div id="backendStatus" class="status warn">Checking reconstructed backend configuration…</div>
<p id="backendNote" class="small">Operational portals remain fail-closed unless the verified backend is explicitly enabled.</p>
<h2>Role Portals</h2>
<div class="grid">
<a id="adminPortalLink" href="admin-launch.html">Admin Portal</a>
<a id="partnerPortalLink" href="partner-launch.html">Partner Portal</a>
<a id="staffPortalLink" href="staff-launch.html">Staff Portal</a>
</div>
<h2>Admin Management</h2>
<div class="grid admin">
<a id="adminStaffLink" href="admin-staff.html">Evolution Staff Management</a>
<a id="adminPartnerPasswordLink" href="admin-partner-password.html">Partner Password Reset</a>
</div>
<div id="backendMeta" class="meta"></div>
</main>
<script>
(()=>{
  const cfg=window.EVOLUTION_VOUCHER_BACKEND||{};
  const validUrl=/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cfg.supabaseUrl||'');
  const validKey=typeof cfg.publishableKey==='string'&&cfg.publishableKey.length>20;
  const validProject=typeof cfg.projectId==='string'&&cfg.projectId.length>5;
  const configured=cfg.enabled===true&&validUrl&&validKey&&validProject;
  const status=document.getElementById('backendStatus');
  const note=document.getElementById('backendNote');
  const meta=document.getElementById('backendMeta');
  if(configured){status.className='status ok';status.textContent='Reconstructed backend configured.';note.textContent='Each portal still verifies its own authenticated operational realm before exposing business functions.';meta.textContent=`Environment: ${cfg.environment||'configured'} • Project: ${cfg.projectId}`;}
  else{status.className='status warn';status.textContent='New backend not configured. Operational access remains disabled for safety.';note.textContent='The links are stable entry points, but each operational portal stays fail-closed until the verified reconstructed backend is explicitly enabled.';meta.textContent=`Environment: ${cfg.environment||'unconfigured'} • backend enabled: ${cfg.enabled===true?'true':'false'}`;}
})();
</script>
</body>
</html>
