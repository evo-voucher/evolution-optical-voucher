<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07152f">
<title>Evolution Optical • Admin Dashboard</title>
<style>html,body{margin:0;min-height:100%;background:#071127;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:20px}.loading{color:#bcc3e3;font-weight:700}</style>
</head>
<body><div class="loading">Loading Admin Dashboard…</div>
<script>
(async()=>{
  const dashboardUrl='admin-dashboard.html?v=20260819-01';
  try{
    const res=await fetch('admin.html?source=20260818-05',{cache:'no-store'});
    if(!res.ok)throw new Error(`Admin source unavailable (${res.status})`);
    let html=await res.text();
    html=html.replace('assets/js/backend-config.js?v=20260818-02','assets/js/backend-config.js?v=20260818-03');
    html=html.replace('let partners=[],branches=[],voucherRows=[],redemptionRows=[];','let partners=[],branches=[],voucherRows=[],redemptionRows=[],partnerMetricRows=[],voucherTypeRows=[];');
    html=html.replace('<div id="voucherStats" class="miniStats"></div><div id="voucherReport" class="tablewrap"></div>','<div id="voucherStats" class="miniStats"></div><div id="voucherTypeBreakdown" class="tablewrap"></div><div id="voucherReport" class="tablewrap"></div>');
    html=html.replace("function renderStats(s){const f=[['Partners',s.partners_total],['Active Partners',s.partners_active],['Vouchers',s.vouchers_total],['Active Vouchers',s.vouchers_active],['Redeemed Vouchers',s.vouchers_redeemed],['Expired Vouchers',s.vouchers_expired],['Completed Redemptions',s.redemptions_completed],['Reversed',s.redemptions_reversed],['Redeemed Today',s.redemptions_today]];$('stats').innerHTML=f.map(([k,v])=>`<div class=\"stat\"><span>${esc(k)}</span><b>${Number(v||0).toLocaleString()}</b></div>`).join('')}","function renderStats(s){const f=[['Partners',s.partners_total],['Active Partners',s.partners_active],['Total Vouchers',s.vouchers_total],['Issued Vouchers',s.vouchers_issued],['Active Vouchers',s.vouchers_active],['Redeemed Vouchers',s.vouchers_redeemed],['Expired Vouchers',s.vouchers_expired],['Completed Redemptions',s.redemptions_completed],['Reversed',s.redemptions_reversed],['Redeemed Today',s.redemptions_today]];$('stats').innerHTML=f.map(([k,v])=>`<div class=\"stat\"><span>${esc(k)}</span><b>${Number(v||0).toLocaleString()}</b></div>`).join('')}");
    html=html.replace("async function loadAdminData(){const[s,v,r,p,b]=await Promise.all([rpc('admin_dashboard_summary'),rpc('admin_voucher_report',{p_partner_id:null,p_limit:500}),rpc('admin_redemption_report',{p_partner_id:null,p_limit:500}),rpc('admin_partner_directory'),rpc('admin_active_branches')]);partners=p||[];branches=b||[];voucherRows=v||[];redemptionRows=r||[];renderStats(s||{});renderPartnerFilters();renderVoucherReport();renderRedemptionReport();renderPartners()}","async function loadAdminData(){const[s,v,r,p,b,pm,vt]=await Promise.all([rpc('admin_dashboard_summary'),rpc('admin_voucher_report',{p_partner_id:null,p_limit:500}),rpc('admin_redemption_report',{p_partner_id:null,p_limit:500}),rpc('admin_partner_directory'),rpc('admin_active_branches'),rpc('admin_partner_reporting_summary'),rpc('admin_voucher_type_summary',{p_partner_id:null})]);partners=p||[];branches=b||[];voucherRows=v||[];redemptionRows=r||[];partnerMetricRows=pm||[];voucherTypeRows=vt||[];renderStats(s||{});renderPartnerFilters();renderVoucherReport();renderRedemptionReport();renderPartners()}");
    html=html.replace('async function verifyAdmin(session){',`function partnerMetric(id){return partnerMetricRows.find(x=>x.partner_id===id)||{}}
function voucherTypesForPartner(id){return voucherTypeRows.filter(x=>x.partner_id===id)}
function renderVoucherTypeBreakdown(){
  const node=$('voucherTypeBreakdown');if(!node)return;
  const pid=$('voucherPartner').value;
  const source=pid?voucherTypeRows.filter(x=>x.partner_id===pid):voucherTypeRows;
  const grouped=new Map();
  source.forEach(r=>{const k=r.voucher_type||'Unspecified',g=grouped.get(k)||{voucher_type:k,vouchers_total:0,vouchers_issued:0,vouchers_active:0,vouchers_redeemed:0,vouchers_expired:0,vouchers_revoked:0};['vouchers_total','vouchers_issued','vouchers_active','vouchers_redeemed','vouchers_expired','vouchers_revoked'].forEach(f=>g[f]+=Number(r[f]||0));grouped.set(k,g)});
  const rows=[...grouped.values()].sort((a,b)=>String(a.voucher_type).localeCompare(String(b.voucher_type)));
  node.innerHTML=!rows.length?'':`<div class="small" style="margin:10px 0 6px;font-weight:800">By Voucher Type</div><table class="list"><thead><tr><th>Type</th><th>Total</th><th>Issued</th><th>Active</th><th>Redeemed</th><th>Expired</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.voucher_type)}</td><td>${Number(r.vouchers_total).toLocaleString()}</td><td>${Number(r.vouchers_issued).toLocaleString()}</td><td>${Number(r.vouchers_active).toLocaleString()}</td><td>${Number(r.vouchers_redeemed).toLocaleString()}</td><td>${Number(r.vouchers_expired).toLocaleString()}</td></tr>`).join('')}</tbody></table>`;
}
const __baseRenderVoucherReport=renderVoucherReport;
renderVoucherReport=function(){__baseRenderVoucherReport();renderVoucherTypeBreakdown()};
renderPartners=function(){
  const q=$('partnerSearch').value.trim().toLowerCase(),rows=partners.filter(p=>!q||String(p.partner_name||'').toLowerCase().includes(q)||String(p.partner_code||'').toLowerCase().includes(q));
  $('partnerControls').innerHTML=rows.map(p=>{const m=partnerMetric(p.partner_id),types=voucherTypesForPartner(p.partner_id);return `<div class="partner"><div class="partnerhead"><div><b>${esc(p.partner_name)}</b><div class="small">${esc(p.partner_code)} • ${esc(p.partner_status)}</div></div><span class="badge">${esc(p.partner_status)}</span></div><div class="miniStats"><div class="miniStat"><span>Issued</span><b>${Number(m.vouchers_issued||p.vouchers_issued||0).toLocaleString()}</b></div><div class="miniStat"><span>Active</span><b>${Number(m.vouchers_active||0).toLocaleString()}</b></div><div class="miniStat"><span>Redeemed</span><b>${Number(m.vouchers_redeemed||0).toLocaleString()}</b></div><div class="miniStat"><span>Expired</span><b>${Number(m.vouchers_expired||0).toLocaleString()}</b></div></div>${types.length?`<div class="small" style="margin-top:8px">${types.map(t=>`${esc(t.voucher_type)}: ${Number(t.vouchers_issued||0).toLocaleString()} issued`).join(' • ')}</div>`:''}<div class="controls"><div class="field"><label>Status</label><select id="st-${p.partner_id}"><option value="active" ${p.partner_status==='active'?'selected':''}>Active</option><option value="suspended" ${p.partner_status==='suspended'?'selected':''}>Suspended</option><option value="archived" ${p.partner_status==='archived'?'selected':''}>Archived</option></select><button class="wide" onclick="setStatus('${p.partner_id}',document.getElementById('st-${p.partner_id}').value)">Save Status</button></div><div class="field"><label>Voucher Limit</label><input id="vl-${p.partner_id}" type="number" min="0" value="${Number(p.voucher_limit||0)}"><button class="wide" onclick="setVoucherLimit('${p.partner_id}')">Save Voucher Limit</button></div><div class="field"><label>Staff Limit</label><input id="sl-${p.partner_id}" type="number" min="0" max="1000" value="${Number(p.staff_limit||0)}"><button class="wide" onclick="setStaffLimit('${p.partner_id}')">Save Staff Limit</button></div><div class="field"><label>Partner Staff</label><div class="status">${Number(p.partner_staff_count||0)} / ${Number(p.staff_limit||0)}</div></div></div><div id="claim-${p.partner_id}" class="claimbox"><button onclick="loadClaimPublic('${p.partner_id}')">Load Claim Access</button></div></div>`}).join('')||'<div class="empty">No Partners match the current search.</div>';
};
window.__EVOLUTION_ADMIN_REFRESH__=loadAdminData;
async function verifyAdmin(session){`);
    html=html.replace('</body>',`<script>
(()=>{
  let lastRefresh=0;
  async function refreshWhenActive(){
    const dashboard=document.getElementById('dashboardState');
    if(!dashboard||dashboard.classList.contains('hidden')||typeof window.__EVOLUTION_ADMIN_REFRESH__!=='function')return;
    const now=Date.now();
    if(now-lastRefresh<1500)return;
    lastRefresh=now;
    try{await window.__EVOLUTION_ADMIN_REFRESH__();}catch(_){}
  }
  window.addEventListener('focus',refreshWhenActive);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshWhenActive();});
  window.addEventListener('load',()=>{
    try{history.replaceState(null,'','${dashboardUrl}');}catch(_){}
  },{once:true});
})();
<\/script></body>`);
    try{history.replaceState(null,'','admin.html?dashboard=20260819-01');}catch(_){}
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    try{history.replaceState(null,'',dashboardUrl);}catch(_){}
    document.body.innerHTML=`<div style="max-width:680px;padding:22px;border:1px solid #6c3bf2;border-radius:18px;background:#101c43">Unable to load Admin Dashboard.<br><small>${String(e?.message||e)}</small></div>`;
  }
})();
</script>
</body>
</html>
